# Stage 2a held-out: GENERIC rule 5 (no examples), image gaia2-oc:ask2g, held-out subset 50 ambiguity + 12 execution (seed 1, disjoint from seed 0).
[target]
dataset = "meta-agents-research-environments/gaia2-cli"
splits = ["ambiguity", "execution"]
subset_manifest = "<RUNS_DIR>/s2/subset_heldout_50a_12e_seed1.json"

[agent]
image = "localhost/gaia2-oc:ask2g"
provider = "anthropic"
model = "deepseek-flash"
base_url = "https://api.deepseek.com/anthropic"
api_key_env = "DEEPSEEK_API_KEY"

[judge]
provider = "openai-compat"
model = "deepseek-flash"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

[run]
timeout = 900
health_timeout = 180
concurrency = 3
pass_at = 1
output_dir = "<RUNS_DIR>/21_prompt_generic_heldout"
log_level = "INFO"
